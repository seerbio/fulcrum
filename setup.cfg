[metadata]
name = fulcrum-ms
author = Seth Just
author_email = sjust@seer.bio
description = Extreme-scale search pipeline from Seer
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seerbio/fulcrum
project_urls =
    Bug Tracker = https://github.com/seerbio/fulcrum/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pyspark[sql]>=3.4.0

    click

    polars
    fsspec
    toml

    directlfq

    wheely-mammoth>=0.17.0,<2.0.0

    airpot>=0.2.3,<2.0.0
    cortado-ms>=0.5.1,<2.0.0
    proffer>=0.2.0,<2.0.0

[options.extras_require]
s3 =
    s3fs
docs =
    numpydoc>=1.0.0
    sphinx-argparse>=0.2.5
    sphinx-rtd-theme>=0.5.0
    nbsphinx>=0.7.1
    ipykernel>=5.3.0
    recommonmark>=0.5.0
dev =
    pre-commit>=2.7.1
    black>=20.8b1
    pytest
    mypy
    types-setuptools
    types-toml
    pandas-stubs

[options.entry_points]
console_scripts =
    fulcrum = fulcrum.cli:main
